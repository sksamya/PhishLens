<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="x-phishlens-scenario" content="suspicious">
  <meta charset="UTF-8">
  <title>Mock 3: Delayed Password Field Insertion</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    form { max-width: 320px; display: flex; flex-direction: column; gap: 0.75rem; }
    input, button { padding: 0.5rem; }
  </style>
</head>
<body>
  <h2>Step 1: Enter Username</h2>
  <form id="step-form" action="/auth/step2" method="POST">
    <label>Email: <input type="email" id="email-field" name="email"></label>
    <button type="button" id="next-btn">Next</button>
  </form>

  <script>
    document.getElementById('next-btn').addEventListener('click', () => {
      setTimeout(() => {
        const pwdLabel = document.createElement('label');
        pwdLabel.innerHTML = 'Password: <input type="password" name="password" id="delayed-pwd">';
        const submitBtn = document.createElement('button');
        submitBtn.type = 'submit';
        submitBtn.textContent = 'Submit Credentials';
        
        const form = document.getElementById('step-form');
        form.appendChild(pwdLabel);
        form.appendChild(submitBtn);
      }, 300);
    });
  </script>
</body>
</html>
