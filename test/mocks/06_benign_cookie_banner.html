<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="x-phishlens-scenario" content="benign">
  <meta charset="UTF-8">
  <title>Mock 6: Benign Cookie Banner</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #18181b;
      color: #fafafa;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .cookie-banner button { padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Standard Website Content</h2>
  <p>This page features a standard cookie consent banner with high z-index that should NOT trigger false positive overlays.</p>

  <div class="cookie-banner" id="cookie-consent">
    <span>We use cookies to improve your experience. By continuing to browse, you agree to our cookie policy.</span>
    <button onclick="document.getElementById('cookie-consent').remove()">Accept All</button>
  </div>
</body>
</html>
