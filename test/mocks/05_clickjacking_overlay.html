<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="x-phishlens-scenario" content="phishing">
  <meta charset="UTF-8">
  <title>Mock 5: Deceptive Transparent Clickjacking Overlay</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; position: relative; }
    .underlying-btn { padding: 12px 24px; font-size: 16px; background: #22c55e; color: white; border: none; border-radius: 4px; }
    /* Malicious transparent overlay hovering over legitimate button */
    .clickjack-overlay {
      position: absolute;
      top: 70px;
      left: 32px;
      width: 140px;
      height: 48px;
      opacity: 0.01;
      background: red;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Clickjacking UI Redressing Test</h2>
  <p>Legitimate button has a near-transparent element overlaid directly above it.</p>
  
  <button class="underlying-btn" id="real-btn">Download PDF</button>
  <div class="clickjack-overlay" id="hijack-layer" title="Adversary Trap"></div>

  <script>
    document.getElementById('hijack-layer').addEventListener('click', () => {
      console.warn('[Attack] User click hijacked by transparent overlay!');
    });
  </script>
</body>
</html>
